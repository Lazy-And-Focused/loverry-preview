effects:
  shake:
    display_name: "Тряска"
    type: "shake"
    description: "Эффект тряски камеры или экрана"
    default_intensity: 0.5
    default_duration: 0.3
    parameters:
      magnitude: 10
  flash:
    display_name: "Вспышка"
    type: "flash"
    description: "Короткая яркая вспышка"
    default_intensity: 0.8
    default_duration: 0.1
    parameters:
      color: "#ffffff"
  zoom:
    display_name: "Зум"
    type: "zoom"
    description: "Плавное приближение или отдаление"
    default_intensity: 1.2
    default_duration: 0.5
  pulse:
    display_name: "Пульсация"
    type: "pulse"
    description: "Ритмичное изменение размера/прозрачности"
    default_intensity: 0.3
    default_duration: 0.6
  fade_in:
    display_name: "Появление"
    type: "fade_in"
    description: "Плавное появление из черноты"
    default_duration: 0.8
  fade_out:
    display_name: "Исчезновение"
    type: "fade_out"
    description: "Плавное затемнение"
    default_duration: 0.8
  blur:
    display_name: "Размытие"
    type: "blur"
    description: "Размытие экрана"
    default_intensity: 0.4
    default_duration: 0.2
  color_shift:
    display_name: "Сдвиг цвета"
    type: "color_shift"
    description: "Временное изменение цветовой гаммы"
    default_intensity: 0.6
    default_duration: 0.3
    parameters:
      color: "#ff0000"
