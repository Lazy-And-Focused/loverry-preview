<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление на плей-тест loverry</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Inter', sans-serif;
            background: #1a1a2e;
            color: #e2e2e2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .message {
            background: rgba(0,0,0,0.6);
            padding: 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(8px);
            max-width: 90%;
        }
        a {
            color: #4cc9f0;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        code {
            background: #2c2c3e;
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="message">
    <p>⏳ Перенаправление в плей-тест...</p>
    <p>Если перенаправление не произошло, <a href="preview/">нажмите здесь</a>.</p>
</div>
<script>
    fetch('preview/index.html', { method: 'HEAD' })
        .then(response => {
            if (response.ok) {
                window.location.replace('preview/');
            } else {
                document.querySelector('.message').innerHTML = `
                    <p>❌ Папка <code>preview/</code> не найдена.</p>
                    <p>Убедитесь, что структура проекта содержит папку <code>preview</code> с файлами <code>index.html</code>, <code>preview.html</code>, <code>all-scene.html</code> и др.</p>
                    <p><a href="https://github.com/Lazy-And-Focused/loverry-preview" target="_blank">Вернуться на GitHub</a></p>
                `;
            }
        })
        .catch(() => {
            document.querySelector('.message').innerHTML = `
                <p>❌ Ошибка проверки. Папка <code>preview/</code> недоступна.</p>
                <p>Возможно, вы открываете файл напрямую с диска (file://) – используйте локальный сервер (например, <code>npx http-server</code>).</p>
                <p><a href="https://github.com/Lazy-And-Focused/loverry-preview" target="_blank">Вернуться на GitHub</a></p>
            `;
        });
</script>
</body>
</html>
